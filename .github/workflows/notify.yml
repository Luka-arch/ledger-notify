name: Ledger daily notifications

on:
  schedule:
    # 04:00 UTC = 08:00 in Tbilisi (Georgia doesn't observe DST, so this
    # offset is fixed year-round — no adjustment needed).
    - cron: "0 4 * * *"
      # lets you trigger this manually from the Actions tab on GitHub, any
  # time, for testing — no in-app "test" button needed anymore.
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node notify.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
